<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vendor Onboarding Automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">VO</div>
      <div>
        <h1>Vendor Onboarding Automation</h1>
        <div class="sub">Submission &rarr; automated checks &rarr; Approved / Pending / Rejected</div>
      </div>
    </div>
    <div class="live-indicator"><span class="live-dot"></span> rules-based decisioning</div>
  </header>

  <nav>
    <button class="tab-btn active" data-view="submit">Submit</button>
    <button class="tab-btn" data-view="run">Live Run</button>
    <button class="tab-btn" data-view="dashboard">Dashboard</button>
  </nav>

  <main>
    <section id="view-submit" class="view active">
      <div class="section-label">One-click demo scenarios</div>
      <div class="scenario-grid" id="scenario-grid"></div>

      <div class="card">
        <div class="section-label" style="margin-bottom:16px;">Or submit a custom vendor</div>
        <form id="submit-form">
          <div class="form-grid">
            <div>
              <label>Company name</label>
              <input name="company_name" required />
              <label>Claimed years in business</label>
              <input name="claimed_years_in_business" type="number" required />
              <label>Claimed industry</label>
              <input name="claimed_industry" required />
              <label>Claimed certificate issue year</label>
              <input name="claimed_issue_year" type="number" />
              <label>GSTIN</label>
              <input name="gstin" required />
              <label>PAN (optional)</label>
              <input name="pan" />
            </div>
            <div>
              <label>CIN (optional)</label>
              <input name="cin" />
              <label>Contact email</label>
              <input name="contact_email" type="email" required />
              <label>Contact phone</label>
              <input name="contact_phone" required />
              <label>Bank account</label>
              <input name="bank_account" required />
              <label>Bank account holder name (optional)</label>
              <input name="bank_account_holder_name" />
              <label>Registered address</label>
              <input name="registered_address" required />
              <label>Certificate PDF (optional)</label>
              <input name="document" type="file" accept="application/pdf" />
            </div>
          </div>
          <button class="primary" type="submit">Run onboarding check &rarr;</button>
        </form>
      </div>
    </section>

    <section id="view-run" class="view">
      <div id="run-content"><div class="empty-state">Run a scenario from the Submit tab to see it here.</div></div>
    </section>

    <section id="view-dashboard" class="view">
      <div class="stat-grid" id="stat-grid"></div>
      <div class="card" style="padding:0;overflow:hidden;">
        <div class="table-scroll">
          <table id="runs-table">
            <thead>
              <tr><th>ID</th><th>Vendor</th><th>Scenario</th><th>Status</th><th>Routing</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
